name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: Mobile
        run: npm install

      - name: Create Android project (first run only)
        working-directory: Mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web files and patch Android project
        working-directory: Mobile
        run: |
          npx cap sync android
          node scripts/patch-android.js

      - name: Install signing keystore
        working-directory: Mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Brak sekretu KEYSTORE_BASE64. Dodaj go w Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/sentinel.keystore
          ls -l android/app/sentinel.keystore

      - name: Build debug APK (stable signature)
        working-directory: Mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-apk
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
